[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]

[tool.codespell]
ignore-words-list = "hass,isy,nid,dof,dfof,don,dfon,automic,automicus,batlvl,homeassistant,colorlog,nd,anull,enull,additionals,alle,alot,ba,bre,bund,datas,dur,ether,farenheit,falsy,fo,haa,hist,iam,iff,iif,incomfort,ines,ist,lightsensor,mut,nam,pres,pullrequests,referer,resset,rime,ser,serie,sur,te,technik,ue,uint,unsecure,visability,wan,wanna,withing,zar,ETo,ETO,THIRDPARTY,bootup"
skip = "./.*,*.csv,*.json"
quiet-level = 2

[tool.ruff]
required-version = ">=0.15.12"
target-version = "py310"
line-length = 88

[tool.ruff.lint]
ignore = [
    "S101",    # use of assert
    "TID252",  # skip
    "SLF001",  # design choice
    "SIM110",  # this is slower
    "S318",    # intentional
    "TRY003",  # nice to have
    "PLR2004", # too many to fix right now
    "PLR0913", # ship has sail on this one
    "PLR0911", # ship has sail on this one
    "PLR0912", # hard to fix without a major refactor
    "PLR0915", # hard to fix without a major refactor
    "PYI034",  # enable when we drop Py3.10
    "RUF003",  # probably not worth fixing
    "SIM105",  # this is slower
    "RUF012",  # mutable class attributes; requires broader refactor
    "PERF401", # list comprehension in entity setup; standard HA pattern
]
select = [
    "ASYNC", # async rules
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "S",     # flake8-bandit
    "F",     # pyflakes
    "E",     # pycodestyle
    "W",     # pycodestyle
    "UP",    # pyupgrade
    "I",     # isort
    "RUF",   # ruff specific
    "FLY",   # flynt
    "G",     # flake8-logging-format
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-pathlib
    "PYI",   # flake8-pyi
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T100",  # Trace found: {name} used
    "T20",   # flake8-print
    "TID",   # Tidy imports
    "TRY",   # tryceratops
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "S101",
    "SLF001",
    "PLR2004",
    "PT011",
    "PT006",
    "PGH003",
    "PT007",
    "PT027",
    "PLW0603",
    "PLR0915",
    "FLY002",
    "PT018",
    "PLR0124",
    "SIM202",
    "PT012",
    "TID252",
    "PLR0913",
    "SIM102",
    "SIM108",
    "T201",
    "PT004",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
